name: Verify package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported LTS releases with the October 2026 security fixes.
        node: ['22.23.4', '24.22.1']
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@^${{ matrix.react }} react-dom@^${{ matrix.react }}
      - run: npm run prepack
      - run: npm run check:packed-install
