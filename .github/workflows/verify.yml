name: Verify package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # jsdom 29, used by the test suite, requires Node 20.19+ or 22.13+.
        node: [20, 22]
        react: [18, 19]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save react@^${{ matrix.react }} react-dom@^${{ matrix.react }}
      - run: npm run prepack
      - run: npm run check:packed-install
